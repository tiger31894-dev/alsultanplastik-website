<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073E78">
<title>Al Sultan Plastik – PPR Pipes &amp; Fittings | Prices &amp; Quotations</title>
<meta name="description" content="Al Sultan Plastik (شركة السلطان) – PPR pipes, welding fittings, brass threaded fittings and valves. Browse products with prices and request a quotation by WhatsApp or email.">
<meta property="og:title" content="Al Sultan Plastik – PPR Pipes &amp; Fittings">
<meta property="og:description" content="Browse PPR pipes and fittings with prices and request a quotation in minutes.">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --navy:#073E78; --blue:#0A5AA8; --sky:#0C8CDB; --aqua:#4FB3EA; --ice:#EAF4FC; --ice2:#F5FAFE;
  --ink:#10223B; --muted:#5B6B80; --line:#D9E6F2; --ok:#1E9E57; --wa:#25D366; --warn:#B7791F;
  --r:16px; --shadow:0 6px 20px rgba(7,62,120,.10);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ice2);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--ice2);position:relative;padding-bottom:calc(76px + var(--safe-bot))}

/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 55%,var(--sky) 100%);color:#fff;padding:calc(10px + var(--safe-top)) 16px 12px;box-shadow:0 2px 12px rgba(7,62,120,.25)}
.top .row{display:flex;align-items:center;gap:12px}
.top img.logo{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.top h1{font-size:19px;margin:0;letter-spacing:.3px}
.top .tag{font-size:12.5px;opacity:.9;margin-top:1px}
.top .back{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.top .cartbtn{margin-left:auto;position:relative;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#FFC93C;color:var(--navy);font-size:12px;font-weight:800;display:grid;place-items:center}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px;height:44px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;height:100%;background:transparent;font-size:15.5px}

/* content */
main{padding:16px}
.hero{position:relative;overflow:hidden;border-radius:var(--r);background:linear-gradient(135deg,#fff 0%,var(--ice) 100%);padding:18px 18px 38px;border:1px solid var(--line);box-shadow:var(--shadow)}
.hero h2{margin:0 0 6px;color:var(--navy);font-size:21px}
.hero p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45;max-width:64%}
.hero img{position:absolute;right:-22px;bottom:-22px;width:120px;opacity:.95}
.hero .wave{position:absolute;left:0;right:0;bottom:0;height:34px;opacity:.5}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec h3{margin:0;font-size:17px;color:var(--navy)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--ice);color:var(--blue)}
.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tabs button{flex:1;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 12px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:150px}
.cat .ic{width:62px;height:62px;border-radius:14px;background:var(--ice);display:grid;place-items:center}
.cat .ic:has(img){width:84px;height:84px;background:#fff}
.cat .ic img{width:100%;height:100%;object-fit:contain;border-radius:14px;background:#fff}
.cat b{font-size:15px;color:var(--ink);line-height:1.2}
.cat small{color:var(--muted);font-size:12.5px;line-height:1.3}
.cat .n{margin-top:auto;font-size:12px;font-weight:700;color:var(--blue)}
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.step .num{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.step div{font-size:14.5px;line-height:1.35}
.contactstrip{margin-top:18px;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;gap:12px}
.contactstrip div{flex:1;font-size:14px;line-height:1.4}
.contactstrip b{font-size:16px}
.btn{height:48px;border-radius:12px;padding:0 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px}
.btn.primary{background:var(--blue);color:#fff}
.btn.white{background:#fff;color:var(--navy)}
.btn.wa{background:var(--wa);color:#fff}
.btn.mail{background:var(--navy);color:#fff}
.btn.ghost{background:var(--ice);color:var(--blue)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}

/* product list */
.plist{display:grid;gap:10px}
.prod{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;box-shadow:0 2px 8px rgba(7,62,120,.05);width:100%}
.prod .ic{width:72px;height:72px;border-radius:12px;background:var(--ice);display:grid;place-items:center;flex:none;overflow:hidden}
.prod .ic img{width:100%;height:100%;object-fit:contain;background:#fff}
.prod .t{flex:1;min-width:0}
.prod .t b{display:block;font-size:15px;line-height:1.25}
.prod .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.prod .add{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.fam{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:6px;margin-bottom:4px}
.fam.ppr{background:#E3F4E8;color:#1F7A3A}.fam.pvc,.fam.pvcd{background:#EDEFF3;color:#4A5565}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(7,30,60,.45);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:60;background:#fff;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .25s ease;max-height:90vh;overflow:auto;padding:10px 18px calc(18px + var(--safe-bot))}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .pic{height:170px;border-radius:16px;background:var(--ice);display:grid;place-items:center;overflow:hidden}
.sheet .pic img{height:100%;width:100%;object-fit:contain;background:#fff}
.sheet h2{margin:14px 0 4px;font-size:20px;color:var(--navy)}
.sheet p.d{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.lbl{font-size:13px;font-weight:800;color:var(--navy);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:44px;height:44px;border-radius:12px;background:var(--ice);color:var(--blue);font-size:22px;font-weight:800}
.qty input{width:80px;height:44px;text-align:center;border:1.5px solid var(--line);border-radius:12px;font-size:17px;font-weight:800}
.qty span{color:var(--muted);font-size:14px}
.sheetfoot{display:flex;gap:10px;margin-top:18px}

/* cart */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ic{width:52px;height:52px;border-radius:10px;background:var(--ice);display:grid;place-items:center;flex:none;overflow:hidden}
.line .ic img{width:100%;height:100%;object-fit:contain;background:#fff}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:14.5px;line-height:1.25}
.line .t small{color:var(--muted);font-size:12.5px}
.mini{display:flex;align-items:center;gap:6px;margin-top:6px}
.mini button{width:30px;height:30px;border-radius:9px;background:var(--ice);color:var(--blue);font-weight:800;font-size:17px}
.mini input{width:52px;height:30px;text-align:center;border:1px solid var(--line);border-radius:9px;font-weight:700}
.del{width:34px;height:34px;border-radius:10px;color:#B23A48;display:grid;place-items:center;flex:none}
.form{display:grid;gap:10px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 5px 2px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15.5px;background:#fff;outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--sky)}
.field.err input{border-color:#D64545}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.banner{background:#FFF7E6;border:1px solid #F3D9A4;color:#7A5410;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-bottom:12px}
.ok{text-align:center;padding:26px 10px}
.ok .big{width:84px;height:84px;border-radius:50%;background:#E3F4E8;display:grid;place-items:center;margin:0 auto 14px}
.ok h2{color:var(--navy);margin:0 0 6px}
.ok p{color:var(--muted);line-height:1.5;margin:0 0 6px}
.ref{display:inline-block;margin:8px 0 16px;padding:6px 12px;border-radius:10px;background:var(--ice);color:var(--navy);font-weight:800;letter-spacing:.5px}

/* contact */
.clist{display:grid;gap:10px}
.cbtn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%;box-shadow:0 2px 8px rgba(7,62,120,.05)}
.cbtn .ci{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.cbtn b{display:block;font-size:15px}
.cbtn small{color:var(--muted);font-size:13.5px}

/* bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0 auto;max-width:560px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--safe-bot));box-shadow:0 -4px 16px rgba(7,62,120,.06)}
nav.bn button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#8A99AD;padding:6px 0;position:relative}
nav.bn button.on{color:var(--blue)}
nav.bn .badge{top:0;right:calc(50% - 22px)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-bot));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.about-hero{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 18px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue) 60%,var(--sky));box-shadow:var(--shadow)}
.about-hero h2{margin:0 0 8px;font-size:22px}
.about-hero p{margin:0;font-size:14.5px;line-height:1.6;opacity:.95}
.anniv{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,#FFF6D8,#FFE7A3);border:1px solid #F5D67A}
.anniv .yrs{min-width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#FFC93C;font-weight:900;font-size:26px;line-height:1;text-align:center;box-shadow:0 0 0 4px #FFC93C}
.anniv .yrs small{display:block;font-size:10px;color:#fff;font-weight:700;margin-top:2px}
.anniv b{color:var(--navy);font-size:16px}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.val{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.val b{display:block;color:var(--navy);margin:6px 0 2px}
.val span{font-size:13px;color:var(--muted);line-height:1.4}
.certs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.cert{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.cert img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:8px;background:var(--ice2);cursor:zoom-in}
.cert b{display:block;font-size:13px;color:var(--navy);margin-top:6px}
.cert.soon{display:grid;place-items:center;min-height:150px;border-style:dashed;color:var(--muted);font-size:13px}
.vids{display:grid;gap:12px;margin-top:12px}
.vid{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.vid video{width:100%;display:block;background:#000;max-height:420px}
.vid b{display:block;padding:10px 12px;color:var(--navy)}
.aboutcard{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);width:100%;text-align:start}
.aboutcard img{width:54px;height:54px;border-radius:50%}
.aboutcard b{color:var(--navy)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
@media (min-width:900px){ .certs{grid-template-columns:repeat(4,1fr)} .vids{grid-template-columns:1fr 1fr} .vals{grid-template-columns:repeat(4,1fr)} }
.appdl{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,#0E7A3E,#1E9E57);color:#fff;box-shadow:var(--shadow)}
.appdl .ai{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
.appdl b{font-size:16px}
.appdl small{display:block;opacity:.92;font-size:12.5px;margin-top:2px;line-height:1.4}
.appdl a{margin-inline-start:auto;flex:none;background:#fff;color:#0E7A3E;font-weight:800;padding:10px 16px;border-radius:12px;text-decoration:none;white-space:nowrap}
.foot{text-align:center;color:#9AA8BA;font-size:12px;margin:26px 0 6px}
.price{color:#0A7A3E;font-weight:800}
.por{color:var(--muted);font-weight:600;font-style:italic}
.chip .pr{display:block;font-size:11.5px;font-weight:700;opacity:.8;margin-top:2px}
.chip.on .pr{opacity:1}
.pricebox{margin-top:14px;padding:12px 14px;border-radius:12px;background:#EFF8F2;border:1px solid #CDEBD8;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px}
.pricebox b{font-size:18px;color:#0A7A3E}
.totalbar{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 2px;border-top:2px solid var(--line);margin-top:6px}
.totalbar b{font-size:20px;color:#0A7A3E}
.lp{font-size:12.5px;margin-top:2px}
.langbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;font-size:11px;font-weight:800;color:#fff;letter-spacing:.3px}
.top .row .langbtn{margin-left:auto}
.top .row .langbtn + .cartbtn{margin-left:0}
.langs{display:grid;gap:10px;margin-top:6px}
.langs button{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700;text-align:start}
.langs button.on{border-color:var(--blue);background:var(--ice)}
.langs .code{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
bdi,.chip{unicode-bidi:isolate}
.chip{direction:ltr}
[dir=rtl] body{font-family:"Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic",Arial,sans-serif}
[dir=rtl] .hero img{right:auto;left:-22px}
[dir=rtl] .back svg{transform:scaleX(-1)}
[dir=rtl] .top .row .langbtn{margin-left:0;margin-right:auto}
[dir=rtl] .badge{right:auto;left:-3px}
[dir=rtl] nav.bn .badge{left:calc(50% - 22px);right:auto}
[dir=rtl] .prod,[dir=rtl] .cat,[dir=rtl] .cbtn{text-align:right}

/* ---------- website: wider layout on tablets / desktops ---------- */
@media (min-width: 900px){
  .app, nav.bn, .sheet{max-width:1100px}
  main{padding:24px 32px}
  .top{margin:0 calc(550px - 50vw);padding-left:calc(50vw - 550px + 32px);padding-right:calc(50vw - 550px + 32px)}
  .top .row{max-width:1100px;margin:0 auto}
  .search{max-width:640px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .plist{grid-template-columns:1fr 1fr}
  .hero{padding:32px 36px 48px}
  .hero h2{font-size:30px}
  .hero p{font-size:16.5px;max-width:58%}
  .hero img{width:200px;right:10px;bottom:-10px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .clist{grid-template-columns:1fr 1fr}
  .sheet{border-radius:22px;bottom:24px;max-width:620px;transform:translateY(calc(100% + 60px))}
  .sheet.on{transform:none}
}
@media (min-width: 1200px){ .grid{grid-template-columns:repeat(5,1fr)} }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="bn" id="nav">
  <button data-go="#home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav_home">Home</span></button>
  <button data-go="#products"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-t="nav_products">Products</span></button>
  <button data-go="#cart"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.7a1.5 1.5 0 0 0 1.5-1.1L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg><span data-t="nav_quote">Quotation</span><span class="badge" id="navbadge" style="display:none"></span></button>
  <button data-go="#contact"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span data-t="nav_contact">Contact</span></button>

const priceOf = (p, size) => p.prices && p.prices[size] != null ? p.prices[size] : null;

function applyLang(){
  document.documentElement.lang = LANG || "en";
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";

}

  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;
}

function cartTotal(){ let sum=0, priced=0, missing=0; cart.forEach(l=>{ const pr=priceOf(PRODS[l.pid], l.size); if(pr!=null){ sum+=pr*l.qty; priced++; } else missing++; }); return {sum, priced, missing}; }
function chg(i,d){ cart[i].qty=Math.max(1,cart[i].qty+d); saveCart(); renderCart(); }
function setq(i,v){ cart[i].qty=Math.max(1,Math.floor(+v||1)); saveCart(); renderCart(); }
function rm(i){ cart.splice(i,1); saveCart(); renderCart(); }
function makeRef(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `QR-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.floor(1000+Math.random()*9000)}`; }
function buildMessage(ref){
  const C = customer, L = [];
  L.push(`${t("msg_title")} – ${CONFIG.company}`);

  L.push("");
  L.push(`${t("m_name")}: ${C.name}`);
  L.push(`${t("m_mobile")}: ${C.phone}`);
  if(C.company) L.push(`${t("m_company")}: ${C.company}`);
  if(C.email) L.push(`${t("m_email")}: ${C.email}`);
  if(C.city) L.push(`${t("m_city")}: ${C.city}`);
  L.push(`${t("m_lang")}: ${LANGS.find(x=>x.c===(LANG||"en")).n}`);
  L.push("");
  L.push(`${t("m_items")} (${cart.length}):`);
  cart.forEach((l,i) => { const pr=priceOf(PRODS[l.pid], l.size);
    L.push(`${i+1}. ${lineName(l)} × ${l.qty} ${un(PRODS[l.pid].unit)}` + (pr!=null ? ` @ ${money(pr)} = ${money2(pr*l.qty)}` : ` (${t("m_on_request")})`)); });
  const tot = cartTotal();
  if(tot.priced){ L.push(""); L.push(`${t("m_total")}: ${money2(tot.sum)}`); L.push(t("m_prices_note",{d:DATA.priceList.date})); }
  if(C.notes){ L.push(""); L.push(`${t("m_notes")}: ${C.notes}`); }
  L.push("");
  L.push(t("m_close"));
  return L.join("\n");
}
function openExternal(url){

}
function send(via, idx){
  const name=$("#c_name").value.trim(), phone=$("#c_phone").value.trim();

  if(!name){ $("#f_name").classList.add("err"); bad=true; }
  if(phone.replace(/\D/g,"").length < 7){ $("#f_phone").classList.add("err"); bad=true; }
  if(bad){ toast(t("need_name")); (name?$("#c_phone"):$("#c_name")).focus(); return; }
  customer.name=name; customer.phone=phone; store.set("asp_customer",customer);
  lastRef = makeRef();
  const msg = buildMessage(lastRef);
  if(via==="wa"){
    const num = ([CONFIG.whatsapp, CONFIG.whatsapp2].filter(Boolean)[idx||0]||"").replace(/\D/g,"");
    openExternal(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`);
  } else {
    openExternal(`mailto:${CONFIG.email||""}?subject=${encodeURIComponent(t("m_subject")+" "+lastRef+" – "+name)}&body=${encodeURIComponent(msg)}`);
  }
  store.set("asp_last", {ref:lastRef, items:cart.length, via, msg});
  lastMsg = msg;
  setTimeout(()=>go("#sent"), 400);
}

  r:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0A5AA8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/></svg>`,

function lbl(o){ return typeof o==="string" ? o : (o && (o[LANG]||o.en)) || ""; }
function zoomImg(src){ const d=document.createElement("div"); d.className="lightbox"; d.innerHTML=`<img src="${src}" alt="">`; d.onclick=()=>d.remove(); document.body.appendChild(d); }
function renderAbout(){
  header({title:t("about_title"), sub:t("tag"), back:false});
  const certs = COMPANY.certificates.length
    ? COMPANY.certificates.map(c=>`<div class="cert"><img src="${c.img}" alt="${esc(lbl(c.name))}" onclick="zoomImg(this.src)"><b>${esc(lbl(c.name))}</b></div>`).join("")
    : [1,2].map(()=>`<div class="cert soon">${t("cert_soon")}</div>`).join("");

    <div class="val">${VAL_ICONS.r}<b>${t("v3t")}</b><span>${t("v3d")}</span></div>
    <div class="val">${VAL_ICONS.s}<b>${t("v4t")}</b><span>${t("v4d")}</span></div>

  <div class="foot">© ${new Date().getFullYear()} Al Sultan Plastik</div>`;
}

/* ---------- router ---------- */
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function route(){
  closeSheet();
  const h = (location.hash || "#home").slice(1);
  const r = h.startsWith("cat-") ? "cat" : h;
  document.querySelectorAll("nav.bn button").forEach(b => {
    const t=b.dataset.go.slice(1); b.classList.toggle("on", t===r || ((r==="cat"||r==="search")&&t==="products") || (r==="sent"&&t==="cart"));
  });
  if(r==="cat") renderCat(h.slice(4));
  else if(r==="products") renderProducts();
  else if(r==="search") renderSearch(searchQ);
  else if(r==="cart") renderCart();
  else if(r==="sent") renderSent();
  else if(r==="contact") renderContact();
  else if(r==="about") renderAbout();
  else renderHome();
  window.scrollTo(0,0);
  if(r==="search"){ const q=$("#q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
}
document.querySelectorAll("nav.bn button").forEach(b => b.onclick = () => go(b.dataset.go));
window.addEventListener("hashchange", route);
if(!LANG){ const nl=(navigator.language||"en").slice(0,2); LANG = ["ar","fr","tr"].includes(nl) ? nl : "en"; applyLang(); route(); openLang(); }
else { applyLang(); route(); }
</script>
